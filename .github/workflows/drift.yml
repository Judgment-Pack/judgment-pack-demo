name: drift

# The demo pins a judgment-pack release and an agent-canvas image; this job
# re-verifies the pins weekly so rot announces itself instead of greeting users.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive the pinned runtime version from .env.example
        run: |
          grep '^JUDGMENT_PACK_VERSION=' .env.example | sed 's/^JUDGMENT_PACK_VERSION=/JP_VERSION=/' >> "$GITHUB_ENV"

      - name: Install the pinned judgment-pack release
        run: |
          curl -fsSL -o jp.tar.gz "https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v${JP_VERSION}/judgment-pack_${JP_VERSION}_linux_amd64.tar.gz"
          tar -xzf jp.tar.gz jpack
          sudo install -m 0755 jpack /usr/local/bin/
          jpack version

      - name: Conformance corpus passes on this machine
        run: jpack spec test-conformance --quiet

      - name: Seed project validates and its matrix passes
        working-directory: projects/judgment-pack-quickstart
        run: |
          jpack packs validate
          jpack packs test

      - name: Enterprise demo project validates and its matrices pass
        working-directory: projects/enterprise-demo
        run: |
          jpack packs validate
          jpack packs test

      - name: Enterprise demo graphs validate and their rows pass
        working-directory: projects/enterprise-demo
        run: |
          jpack experimental graph validate
          jpack experimental graph test

      - name: MCP server answers the handshake
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"drift-ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | JPACK_CONFIG=projects/judgment-pack-quickstart/jpack.json jpack mcp \
            | grep -q '"experimental_evaluate"'

      - name: Pasted author_pack prompt still matches the pinned runtime
        # prompts/author_pack-prompt.txt is a verbatim copy of the runtime's
        # author_pack prompt, for clients that expose tools but not prompts. It
        # silently drifted for three releases -- telling agents to declare
        # specVersion 0.1.0-draft while this repo's own packs declare
        # 0.2.0-draft -- because nothing compared it to the release it claims to
        # be a copy of. This does.
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"drift-ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"prompts/get","params":{"name":"author_pack"}}' \
            | JPACK_CONFIG=projects/judgment-pack-quickstart/jpack.json jpack mcp \
            > prompts-response.jsonl
          python3 - <<'PY' > author_pack-from-runtime.txt
          import json
          for line in open("prompts-response.jsonl"):
              message = json.loads(line)
              if message.get("id") == 2:
                  print("".join(part["content"]["text"]
                                for part in message["result"]["messages"]), end="")
          PY
          diff -u prompts/author_pack-prompt.txt author_pack-from-runtime.txt \
            || { echo "::error::prompts/author_pack-prompt.txt has drifted from the pinned runtime's author_pack prompt; re-paste it"; exit 1; }
          rm -f prompts-response.jsonl author_pack-from-runtime.txt

      - name: Match the container user to this runner
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Demo image builds
        run: docker compose build

      - name: Stack comes up, seeds MCP, and the server lists its tools
        run: |
          docker compose up -d --wait openhands || docker compose up -d openhands
          docker compose run --rm mcp-seed
          KEY=$(sudo cat state/agent-canvas/api-key.txt)
          curl -fsS -H "X-Session-API-Key: $KEY" http://localhost:8000/api/settings | grep -q '"jpack"'
          curl -fsS -X POST -H "X-Session-API-Key: $KEY" -H "Content-Type: application/json" \
            http://localhost:8000/api/mcp/test \
            -d '{"name":"jpack","server":{"type":"stdio","command":"jpack","args":["mcp"],"env":{"JPACK_CONFIG":"/projects/judgment-pack-quickstart/jpack.json"}}}' \
            | grep -q '"experimental_evaluate"'
          docker compose down
