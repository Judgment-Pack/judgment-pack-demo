name: drift

# The demo pins a judgment-pack release and an agent-canvas image; this job
# re-verifies the pins weekly so rot announces itself instead of greeting users.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive the pinned runtime version from .env.example
        run: |
          grep '^JUDGMENT_PACK_VERSION=' .env.example | sed 's/^JUDGMENT_PACK_VERSION=/JP_VERSION=/' >> "$GITHUB_ENV"

      - name: Install the pinned judgment-pack release
        run: |
          curl -fsSL -o jp.tar.gz "https://github.com/Judgment-Pack/judgment-pack-runtime/releases/download/v${JP_VERSION}/judgment-pack_${JP_VERSION}_linux_amd64.tar.gz"
          tar -xzf jp.tar.gz jpack
          sudo install -m 0755 jpack /usr/local/bin/
          jpack version

      - name: Conformance corpus passes on this machine
        run: jpack spec test-conformance --quiet

      - name: Seed project validates and its matrix passes
        working-directory: projects/judgment-pack-quickstart
        run: |
          jpack packs validate
          jpack packs test

      - name: Enterprise demo project validates and its matrices pass
        working-directory: projects/enterprise-demo
        run: |
          jpack packs validate
          jpack packs test
          # The reviewed-set lock (ADR-0019): the committed law must match its lock.
          jpack packs verify

      - name: Generated graph inputs are current
        # graphs/inputs-*.json are DERIVED from vendor-onboarding.rows.json, which
        # is what `graph test` actually executes. They exist as files because
        # DEMO.md Act 3 hand-runs each scenario, and the runtime's graph matrix
        # format cannot reference one. Deriving them means the two cannot disagree.
        run: python3 scripts/gen-graph-inputs.py --check

      - name: Enterprise demo graphs validate and their rows pass
        working-directory: projects/enterprise-demo
        run: |
          jpack experimental graph validate
          jpack experimental graph test

      - name: MCP server answers the handshake
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"drift-ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | JPACK_CONFIG=projects/judgment-pack-quickstart/jpack.json jpack mcp \
            | grep -q '"experimental_evaluate"'

      - name: Pasted author_pack prompt still matches the pinned runtime
        # prompts/author_pack-prompt.txt is a verbatim copy of the runtime's
        # author_pack prompt, for clients that expose tools but not prompts. It
        # silently drifted for three releases -- telling agents to declare
        # specVersion 0.1.0-draft while this repo's own packs declare
        # 0.2.0-draft -- because nothing compared it to the release it claims to
        # be a copy of. This does.
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"drift-ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"prompts/get","params":{"name":"author_pack"}}' \
            | JPACK_CONFIG=projects/judgment-pack-quickstart/jpack.json jpack mcp \
            > prompts-response.jsonl
          python3 - <<'PY' > author_pack-from-runtime.txt
          import json
          for line in open("prompts-response.jsonl"):
              message = json.loads(line)
              if message.get("id") == 2:
                  print("".join(part["content"]["text"]
                                for part in message["result"]["messages"]), end="")
          PY
          diff -u prompts/author_pack-prompt.txt author_pack-from-runtime.txt \
            || { echo "::error::prompts/author_pack-prompt.txt has drifted from the pinned runtime's author_pack prompt; re-paste it"; exit 1; }
          rm -f prompts-response.jsonl author_pack-from-runtime.txt

      - name: Match the container user to this runner
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Demo image builds
        # From .env.example, so the committed pins (not compose.yml's
        # fallback defaults) are what this job actually builds and exercises.
        run: |
          cp .env.example .env
          docker compose build

      - name: Stack comes up, seeds MCP, and the server lists its tools
        run: |
          docker compose up -d --wait openhands || docker compose up -d openhands
          docker compose run --rm mcp-seed
          KEY=$(sudo cat state/agent-canvas/api-key.txt)
          curl -fsS -H "X-Session-API-Key: $KEY" http://localhost:8000/api/settings | grep -q '"jpack"'
          curl -fsS -X POST -H "X-Session-API-Key: $KEY" -H "Content-Type: application/json" \
            http://localhost:8000/api/mcp/test \
            -d '{"name":"jpack","server":{"type":"stdio","command":"jpack","args":["mcp"],"env":{"JPACK_CONFIG":"/projects/judgment-pack-quickstart/jpack.json"}}}' \
            | grep -q '"experimental_evaluate"'

      - name: Attested screening acquires, verifies, derives, and refuses tampering
        # The matrix suites cannot see wiring defects; this is the only
        # automated coverage the attested act has. The recreate cycle at the
        # end is the exact motion (a host restart) that strands the gateway in
        # a dead namespace — and the only way CI catches that coupling
        # regressing.
        run: |
          docker compose up -d gateway
          for i in $(seq 1 30); do
            docker compose exec -T openhands sh -c 'curl -fsS http://127.0.0.1:8787/publickey' >/dev/null 2>&1 && break
            sleep 1
          done
          docker compose exec -T openhands sh -c 'curl -fsS http://127.0.0.1:8787/publickey' >/dev/null \
            || { echo "::error::gateway never answered on the sandbox loopback"; docker compose logs gateway; exit 1; }
          docker compose exec -T -w /projects/enterprise-demo openhands sh -ec '
            attest screen "Meridian Maritime Holdings SA" --template graphs/inputs-meridian-match.json
            attest check
            diff attested/screening-inputs.json graphs/inputs-meridian-match.json
            jpack experimental graph evaluate graphs/vendor-onboarding.graph.json \
              --inputs attested/screening-inputs.json | grep -q "outcome reject"
            attest tamper --match-count 0
            if attest check; then echo "tampered store still verified"; exit 1; fi
            jpack experimental graph evaluate graphs/vendor-onboarding.graph.json \
              --inputs attested/screening-inputs.json | grep -q "unresolved"
          '
          docker compose up -d --force-recreate openhands
          docker compose up -d --force-recreate gateway
          for i in $(seq 1 30); do
            docker compose exec -T openhands sh -c 'curl -fsS http://127.0.0.1:8787/publickey' >/dev/null 2>&1 && break
            sleep 1
          done
          docker compose exec -T openhands sh -c 'curl -fsS http://127.0.0.1:8787/publickey' >/dev/null \
            || { echo "::error::gateway never answered on the sandbox loopback"; docker compose logs gateway; exit 1; }
          docker compose exec -T -w /projects/enterprise-demo openhands sh -ec '
            attest screen "Northwind Analytics Ltd" --template graphs/inputs-northwind-clear.json
            attest check
            jpack experimental graph evaluate graphs/vendor-onboarding.graph.json \
              --inputs attested/screening-inputs.json | grep -q "outcome approve"
            # The project declares an audit directory: the graph runs above must
            # have written the decision book, and node + composite lines share a run.
            test -s audit/evaluations.jsonl
            grep -q "\"kind\":\"graph-composite\"" audit/evaluations.jsonl
          '
          # The decision desk (Act 6): the wall between the copy the sandbox can
          # edit and the copy that judges. Nothing else in CI covers it, and the
          # property it asserts cannot be checked from inside the sandbox by
          # construction — only by forging the local law and watching the desk
          # not move.
          docker compose exec -T -w /projects/enterprise-demo openhands sh -ec '
            attest decide sanctions-screening \
              --facts requests/desk-facts-screening.json \
              --evidence requests/desk-evidence-screening.json
            test -s attested/decision.json
            grep -q "\"outcomeId\": \"match\"" attested/decision.json
            grep -q "\"kind\": \"outcome\"" attested/decision.json

            # Forge the LOCAL law: redefine "clear" to mean two matches.
            # Two edits, because one leaves both rules firing and the pack
            # refuses with a conflict — its structure resists a lazy forgery
            # and not a careful one, which is the point.
            sed -i -e "s/\"value\": \"0\"/\"value\": \"2\"/" \
                   -e "s/\"value\": \"1\"/\"value\": \"9\"/" \
                   packs/sanctions-screening.pack.json

            # Layer 1 — the LOCK (ADR-0019): with this project locked, the
            # deciding surface refuses the drifted declared pack outright.
            # Silent tampering is no longer evaluable locally.
            if jpack experimental evaluate --pack-id sanctions-screening \
              --facts requests/desk-facts-screening.json \
              --evidence requests/desk-evidence-screening.json >/tmp/forged.out 2>&1; then
              echo "::error::a drifted declared pack evaluated; the lock did not refuse"; exit 1
            fi
            grep -q "JPS-LOCK-VERIFY" /tmp/forged.out \
              || { echo "::error::the refusal did not carry JPS-LOCK-VERIFY"; cat /tmp/forged.out; exit 1; }

            # Layer 2 — the lock is evidence, not a wall: the forger re-locks
            # (the documented limit) and the forged copy now answers clear.
            jpack packs lock >/dev/null
            jpack experimental evaluate --pack-id sanctions-screening \
              --facts requests/desk-facts-screening.json \
              --evidence requests/desk-evidence-screening.json \
              --format json | grep -q "\"outcomeId\":\"clear\"" \
              || { echo "::error::the re-locked forge did not flip the answer"; exit 1; }

            # Layer 3 — the DESK is unmoved: it never reads this tree.
            rm -f attested/decision.json
            attest decide sanctions-screening \
              --facts requests/desk-facts-screening.json \
              --evidence requests/desk-evidence-screening.json
            grep -q "\"outcomeId\": \"match\"" attested/decision.json \
              || { echo "::error::the desk followed the forged local law"; exit 1; }

            # Restore from the read-only baked copy, re-lock, and prove the
            # regenerated lock is byte-identical to the reviewed one the desk
            # carries — determinism closing the loop.
            cp /usr/local/share/desk/enterprise-demo/packs/sanctions-screening.pack.json packs/
            jpack packs lock >/dev/null
            diff jpack.lock.json /usr/local/share/desk/enterprise-demo/jpack.lock.json \
              || { echo "::error::the restored lock differs from the reviewed lock"; exit 1; }
            jpack experimental evaluate --pack-id sanctions-screening \
              --facts requests/desk-facts-screening.json \
              --evidence requests/desk-evidence-screening.json \
              --format json | grep -q "\"outcomeId\":\"match\""
          '
          docker compose down
