services:
  openhands:
    build:
      context: .
      args:
        AGENT_CANVAS_VERSION: ${AGENT_CANVAS_VERSION:-1.6.1}
        JUDGMENT_PACK_VERSION: ${JUDGMENT_PACK_VERSION:-0.6.2}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: judgment-pack-demo:${JUDGMENT_PACK_VERSION:-0.6.2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The file browser's root: every folder here is a project the agent can open.
      - ${PACKS_DIR:-./projects}:/projects
      # OpenHands state (settings, sessions) plus the pre-seeded MCP config.
      - ./state:/home/openhands/.openhands
    stdin_open: true
    tty: true
    # Survive host/WSL restarts: the sandbox comes back without a manual
    # `docker compose up` (state and MCP seeding persist in ./state).
    restart: unless-stopped

  # Static server for the zoomable diagram viewers, reachable from the host
  # browser.
  diagrams:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ${PACKS_DIR:-./projects}:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Oneshot: registers the judgment-pack MCP server in agent-canvas settings on
  # first boot (agent-canvas stores MCP config in its settings API, not a file).
  mcp-seed:
    image: curlimages/curl:8.14.1
    # Same identity as the app user: the api key file it must read is mode 600.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      - openhands
    volumes:
      - ./state:/state:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/seed-mcp.sh"]
    restart: "no"
